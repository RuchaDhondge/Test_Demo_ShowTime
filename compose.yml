services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_LAN_BIND_IP:-127.0.0.1}:${POSTGRES_LAN_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking} -d ${POSTGRES_DB:-booking}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  aws-emulator:
    build:
      context: ./aws-emulator
    command: ["-p", "9297", "--auth", "off", "--telemetry", "off"]
    ports:
      - "127.0.0.1:${AWS_EMULATOR_PORT:-9297}:9297"
    environment:
      HOME: ${HOME}
    volumes:
      - ${HOME}/.aws/emulator:${HOME}/.aws/emulator
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://127.0.0.1:9297/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  aws-emulator-proxy:
    image: nginx:1.29-alpine
    volumes:
      - ./aws-emulator/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      aws-emulator:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-booking}
      DB_USER: ${POSTGRES_USER:-booking}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-booking-local-only}
      REDIS_HOST: redis
      AWS_ENDPOINT_URL: http://aws-emulator-proxy:9298
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: emulator
      AWS_SECRET_ACCESS_KEY: emulator
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_S3_BUCKET: booking-demo-assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      aws-emulator:
        condition: service_healthy
      aws-emulator-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
