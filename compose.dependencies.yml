name: demobooking-dev

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-booking}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-booking}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DEV_POSTGRES_USER:-booking} -d ${DEV_POSTGRES_DB:-booking}
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  aws-emulator:
    build:
      context: ./aws-emulator
    command: ["-p", "9297", "--auth", "off", "--telemetry", "off"]
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://127.0.0.1:9297/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  aws-emulator-proxy:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${DEV_AWS_ENDPOINT_PORT:-9298}:9298"
    volumes:
      - ./aws-emulator/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      aws-emulator:
        condition: service_healthy

volumes:
  postgres-dev-data:
  redis-dev-data:
