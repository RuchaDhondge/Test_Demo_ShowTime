name: CI and publish images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    outputs:
      backend-image: ${{ steps.image-names.outputs.backend-image }}
      web-image: ${{ steps.image-names.outputs.web-image }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create lowercase image names
        id: image-names
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend-image=ghcr.io/${repository}/backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web-image=ghcr.io/${repository}/web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend-latest=ghcr.io/${repository}/backend:latest" >> "$GITHUB_OUTPUT"
          echo "web-latest=ghcr.io/${repository}/web:latest" >> "$GITHUB_OUTPUT"

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image-names.outputs.backend-image }}
            ${{ steps.image-names.outputs.backend-latest }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image-names.outputs.web-image }}
            ${{ steps.image-names.outputs.web-latest }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: [self-hosted, demo-showtime]
    environment: demo-showtime
    concurrency:
      group: demo-showtime-deployment
      cancel-in-progress: false
    env:
      DOCKER_HOST: unix:///Users/rucha.dhondge/.docker/run/docker.sock

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Prepare job-scoped GHCR credentials
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/docker-config"
          auth="$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64)"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" \
            > "$RUNNER_TEMP/docker-config/config.json"
          chmod 600 "$RUNNER_TEMP/docker-config/config.json"

      - name: Pull and run the commit-SHA images
        env:
          GHCR_BACKEND_IMAGE: ${{ needs.publish.outputs.backend-image }}
          GHCR_WEB_IMAGE: ${{ needs.publish.outputs.web-image }}
        run: |
          /Users/rucha.dhondge/.docker/bin/docker-compose -p demobooking \
            -f compose.yml -f compose.ghcr.yml pull backend web
          /Users/rucha.dhondge/.docker/bin/docker-compose -p demobooking \
            -f compose.yml -f compose.ghcr.yml up -d --no-build backend web

      - name: Verify the shared application
        run: |
          curl --fail --retry 12 --retry-delay 5 \
            http://127.0.0.1:8080/healthz
          curl --fail \
            'http://127.0.0.1:8080/api/events?city=Pune'
          curl --fail \
            'http://127.0.0.1:8080/api/events/1/seats'

      - name: Remove job-scoped GHCR credentials
        if: always()
        run: rm -rf "$DOCKER_CONFIG"
